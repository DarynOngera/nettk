name: pages

on:
  push:
    branches: [master, phase-2-3]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: configure pages
        uses: actions/configure-pages@v5
      - name: upload site/
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: deploy
        id: deployment
        uses: actions/deploy-pages@v4